# Copy to configs/paths.yaml (git-ignored) and fill in, or point MULTISMPL_PATHS at another file.
# Relative paths are resolved against the repository root.
checkpoint: checkpoints/nano4_checkpoint_19.pt
smplx_root: body_models/smplx            # <root>/{neutral,female,male}/model.pkl  (https://smpl-x.is.tue.mpg.de)
